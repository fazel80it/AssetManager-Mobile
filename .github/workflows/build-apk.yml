name: Build AssetManager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --yes --module-name mobile_main_copy.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AssetManager-APK
          path: build/apk
          if-no-files-found: error